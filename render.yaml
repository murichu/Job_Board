services:
  # Backend Web Service
  - type: web
    name: job-portal-backend
    env: node
    rootDir: server
    buildCommand: npm run build
    startCommand: npm start
    plan: starter
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: Job-portal
      - key: JWT_SECRET
        sync: false
      - key: SECRET_ENCRYPTION_KEY
        sync: false
      - key: CLIENT_URL
        value: http://localhost:5174
      - key: REDIS_URL
        fromService:
          type: redis
          name: job-portal-redis
          property: connectionString
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_SECRET_KEY
        sync: false
      - key: EMAIL_ENABLED
        value: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM_NAME
        value: Job Portal Platform
      - key: MPESA_ALLOWED_IPS
        sync: false
      - key: APP_URL
        value: http://localhost:5000
      - key: SAVED_SEARCH_SCHEDULER_INTERVAL_MS
        value: 3600000

# Databases
databases:
  - name: job-portal-mongodb
    type: mongodb
    version: "7.0"
    plan: starter

  - name: job-portal-redis
    type: redis
    version: "7"
    plan: starter
